<html><head><meta charset="utf-8">

<title>Latoison Law</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#f2f4f7;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#111;-webkit-text-size-adjust:100%}
.nav{position:sticky;top:0;z-index:5;background:#17324d;color:#fff;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 12px;min-height:52px}
.nav .bk{font-size:17px;font-weight:700;color:#9fd3ff;background:none;border:none;padding:6px 4px;cursor:pointer;min-width:84px;text-align:left}
.nav .t{font-size:18px;font-weight:800;flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav .sp{min-width:84px}.nav.long .t{font-size:15px;text-align:right}.nav.long .sp{min-width:0}
.body{padding:14px;max-width:560px;margin:0 auto;padding-bottom:calc(30px + env(safe-area-inset-bottom))}
label{display:block;font-weight:800;font-size:14px;margin:12px 0 5px;color:#17324d}
input,select{width:100%;height:48px;border:2px solid #9aa8b6;border-radius:10px;background:#fff;font-size:17px;padding:0 12px;color:#111;font-family:inherit;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,#17324d 50%),linear-gradient(135deg,#17324d 50%,transparent 50%);background-position:calc(100% - 18px) 21px,calc(100% - 12px) 21px;background-size:6px 6px;background-repeat:no-repeat}
input:focus,select:focus{outline:none;border-color:#17324d}
.row{display:flex;gap:10px}.row>div{flex:1;min-width:0}
.btn{display:block;width:100%;text-align:center;background:#17734a;color:#fff;font-weight:900;font-size:18px;border-radius:12px;padding:15px;margin-top:18px;border:none;cursor:pointer}
.btn:disabled{opacity:.6}
.hint{font-size:13px;color:#222;margin-top:10px;text-align:center}
.err{background:#fdecea;border:2px solid #b91c1c;color:#7f1010;border-radius:10px;padding:10px 12px;font-weight:700;margin-top:12px}
.wait{text-align:center;padding:40px 10px;font-weight:800;color:#17324d}
.spin{width:38px;height:38px;border:5px solid #cdeee9;border-top-color:#17324d;border-radius:50%;margin:0 auto 14px;animation:sp 0.9s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.who{font-size:16px;font-weight:900;margin:6px 0 10px}.who .m{font-size:12px;font-weight:900;color:#fff;background:#17734a;border-radius:5px;padding:2px 6px;margin-left:6px;vertical-align:2px}
.res{display:block;width:100%;text-align:left;background:#fff;border:none;border-radius:12px;margin-bottom:10px;padding:10px 12px;border-left:6px solid #1d4ed8;cursor:pointer;font-family:inherit;color:#111}
.res.i{border-left-color:#b91c1c}.res.c{border-left-color:#ea580c}.res.a{border-left-color:#6d28d9}
.rt{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dn{font-weight:900;font-size:15px;color:#17324d}.ct{font-weight:900;font-size:12px;background:#17324d;color:#fff;border-radius:5px;padding:2px 6px}
.st{font-weight:900;font-size:11px;color:#fff;border-radius:5px;padding:2px 7px;background:#1d4ed8;text-transform:uppercase;white-space:nowrap}.st.i{background:#b91c1c}.st.c{background:#ea580c}.st.a{background:#6d28d9}
.rs{font-size:13.5px;margin-top:4px;color:#111}.rs .nx{color:#b91c1c;font-weight:900}
.card{background:#fff;border-radius:14px;padding:14px}
.nm{font-size:22px;font-weight:900}.dob{font-size:15px;font-weight:700;color:#222}
.next{margin-top:8px;background:#fdecea;border:2px solid #b91c1c;border-radius:10px;padding:8px 10px;color:#b91c1c;font-weight:900;font-size:16px}
.nonext{margin-top:8px;background:#eef1f4;border-radius:10px;padding:8px 10px;color:#222;font-weight:800;font-size:15px}
.cust{margin-top:8px;background:#b91c1c;color:#fff;font-weight:900;border-radius:8px;padding:6px 10px;font-size:14px}
.kv{margin-top:10px;font-size:15px;line-height:1.5}.kv b{color:#17324d}
.sec{display:flex;width:100%;margin-top:10px;background:#cdeee9;border:none;border-radius:10px;padding:12px;font-weight:900;font-size:16px;justify-content:space-between;cursor:pointer;font-family:inherit;color:#111}
.sec.open{border-radius:10px 10px 0 0}.secb{background:#fff;border:2px solid #cdeee9;border-top:none;border-radius:0 0 10px 10px;padding:6px 10px}
.ch{border-bottom:1px solid #e3e8ee;padding:7px 0;font-size:14px}.ch:last-child{border:none}
.gr{display:inline-block;min-width:30px;font-weight:900;color:#fff;background:#17324d;border-radius:4px;text-align:center;font-size:12px;padding:1px 4px;margin-right:6px}
.ch .s{font-weight:800}.ch .d{font-size:12.5px;color:#222}.ch .dp{font-size:12.5px;font-weight:800;color:#6d28d9}
.more{display:block;width:100%;background:none;border:none;text-align:center;font-weight:800;color:#0b4fa0;padding:8px;font-size:14px;cursor:pointer}
.ev{display:flex;gap:8px;border-bottom:1px solid #e3e8ee;padding:7px 0;font-size:14px}.ev:last-child{border:none}.ev .w{min-width:92px;font-weight:800}.ev.past{color:#555}.ev.nx{color:#b91c1c;font-weight:900}
.ev .es{font-size:12px;font-weight:800}
.pt{padding:7px 0;border-bottom:1px solid #e3e8ee;font-size:14.5px}.pt:last-child{border:none}.pt .r{font-size:12px;font-weight:900;color:#17324d;text-transform:uppercase}
.pt a{color:#0b4fa0;font-weight:800}
.pdf{display:block;text-align:center;border:2px solid #17324d;color:#17324d;font-weight:900;border-radius:10px;padding:12px;margin-top:12px;font-size:16px;text-decoration:none;background:#fff}
.note{font-size:12px;color:#333;text-align:center;margin-top:14px;line-height:1.4}
.hide{display:none}
.clr{display:block;width:60%;margin:10px auto 0;text-align:center;background:#ea580c;color:#fff;font-weight:900;font-size:15px;border:none;border-radius:10px;padding:10px;cursor:pointer;font-family:inherit}
.brand{display:flex;align-items:center;gap:12px;background:#17324d;color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.brand img{width:54px;height:54px;border-radius:12px;background:#fff;flex:none}.brand .bn{font-size:25px;font-weight:900;letter-spacing:.3px;line-height:1.1}
.brand a{display:inline-block;color:#9fd3ff;font-weight:800;font-size:18px;text-decoration:none;margin-top:2px}
.ad{margin-top:6px}.ad summary{display:inline-block;font-weight:900;font-size:14px;color:#0b4fa0;background:#fff;border:2px solid #0b4fa0;border-radius:8px;padding:4px 10px;cursor:pointer;list-style:none}
.ad summary::-webkit-details-marker{display:none}.ad[open] summary{background:#0b4fa0;color:#fff}
.ad a{display:block;margin-top:6px;background:#fff;border:2px solid #9aa8b6;border-radius:10px;padding:8px 10px;color:#111;font-weight:700;font-size:15px;text-decoration:none;line-height:1.35}
.ad a .go{display:block;color:#0b4fa0;font-weight:900;margin-top:4px}
html{background:#fff url(bg.jpg) repeat;background-size:250px auto}body{background:transparent!important}
#sf{background:#fff;border-radius:14px;padding:2px 14px 14px;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.note,.who,.wait{background:#fff;border-radius:10px;padding:8px 10px}.note{margin-top:12px}.who{display:block;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.res,.card,.share{box-shadow:0 1px 4px rgba(0,0,0,.18)}
.body.srch{display:flex;flex-direction:column;min-height:calc(100vh - 80px - env(safe-area-inset-top))}.shwrap{margin-top:auto;padding-top:22px}.shwrap .share{margin-top:0}
.share{display:block;width:100%;text-align:center;background:#fff;color:#17324d;font-weight:900;font-size:17px;border:2px solid #17324d;border-radius:12px;padding:13px;margin-top:22px;cursor:pointer;font-family:inherit}
.shbox{background:#fff;border:2px solid #17324d;border-top:none;border-radius:0 0 12px 12px;margin-top:-4px;padding:12px}
.shbox a{display:block;text-align:center;background:#17734a;color:#fff;font-weight:900;font-size:16px;border-radius:10px;padding:12px;margin-bottom:10px;text-decoration:none}
.shbox a.em{background:#17324d}.shbox textarea{width:100%;height:150px;border:2px solid #9aa8b6;border-radius:8px;font-size:13px;font-family:inherit;padding:8px}
.shbox .t{font-size:13px;font-weight:800;color:#17324d;margin:4px 0 6px}
.ch .sn{font-size:12.5px;font-weight:800;color:#111;margin-top:2px}.ch .cn{font-size:12px;color:#333}
</style></head>
<body>
<div class="brand"><img src="icon-192.png" alt=""><div><div class="bn">Latoison Law</div><a href="tel:6109991439">610-999-1439</a></div></div>
<div class="nav"><button class="bk" id="back" type="button"></button><span class="t" id="title">Latoison Law</span><span class="sp"></span></div>
<div class="body" id="main"></div>
<script src="courts.js"></script>
<script>
window.LL_API="https://script.google.com/macros/s/AKfycbxs4tI_oF_y-hUfI_Cs2_zyAW_7k4gIzLl6XvLXfVVkO-OjvYnhUxCUqERVdTXwHtB2/exec";
const LL={build:'LL App Draft 3 (web)',counties:["Adams", "Allegheny", "Armstrong", "Beaver", "Bedford", "Berks", "Blair", "Bradford", "Bucks", "Butler", "Cambria", "Cameron", "Carbon", "Centre", "Chester", "Clarion", "Clearfield", "Clinton", "Columbia", "Crawford", "Cumberland", "Dauphin", "Delaware", "Elk", "Erie", "Fayette", "Forest", "Franklin", "Fulton", "Greene", "Huntingdon", "Indiana", "Jefferson", "Juniata", "Lackawanna", "Lancaster", "Lawrence", "Lebanon", "Lehigh", "Luzerne", "Lycoming", "McKean", "Mercer", "Mifflin", "Monroe", "Montgomery", "Montour", "Northampton", "Northumberland", "Perry", "Philadelphia", "Pike", "Potter", "Schuylkill", "Snyder", "Somerset", "Sullivan", "Susquehanna", "Tioga", "Union", "Venango", "Warren", "Washington", "Wayne", "Westmoreland", "Wyoming", "York"],appUrl:location.origin+location.pathname};
['build','counties','appUrl'].forEach(k=>{if(typeof LL[k]==='string'&&/^[\["]/.test(LL[k]))try{LL[k]=JSON.parse(LL[k])}catch(e){}});if(!Array.isArray(LL.counties))LL.counties=[];
const S={view:'search',form:{last:'',first:'',dob:'',county:'',status:'Active',type:''},results:null,card:null,cardFor:null,open:{},busy:false,error:''};
function dev(){try{let d=localStorage.getItem('llDev');if(!d){d=Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem('llDev',d)}return d}catch(e){return 'nostore'}}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c])}
function call(fn,arg){return new Promise((ok,no)=>{if(false){google.script.run.withSuccessHandler(ok).withFailureHandler(e=>no(e))[fn](arg)}
 else{const q=new URLSearchParams(Object.assign({api:fn==='llSearch'?'search':'card'},arg));fetch((window.LL_API||'')+'?'+q,{credentials:'omit'}).then(r=>r.json()).then(ok,no)}})}
function stCls(s){return /^active/i.test(s)?'':/^inactive/i.test(s)?'i':/^adjud/i.test(s)?'a':'c'}
function day(us){const m=String(us||'').match(/(\d{2})\/(\d{2})\/(\d{4})/);if(!m)return '';return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date(+m[3],m[1]-1,+m[2]).getDay()]}
function go(view,push){S.view=view;S.error='';if(push!==false){try{history.pushState({v:view},'');S.depth=(S.depth||0)+1}catch(e){}}render();window.scrollTo(0,0)}
window.addEventListener('popstate',e=>{S.depth=Math.max(0,(S.depth||0)-1);const v=e.state&&e.state.v||'search';S.view=v==='card'&&!S.card?(S.results?'results':'search'):v;render()});

function lastNm(n){const t=String(n||'').replace(/[.,]/g,' ').split(/\s+/).filter(x=>x&&!/^(jr|sr|ii|iii|iv)$/i.test(x));return t.length?t[t.length-1]:''}
function llPlace(c,e){const dn=String(c.dn||''),t=String((e&&e.type)||''),cp=LL_CP[c.county],P=a=>({name:a[0],street:a[1],city:a[2]+', PA '+a[3]});
 if(/^MC-/.test(dn))return P(LL_CP.Philadelphia);if(/^CP-/.test(dn))return cp?P(cp):null;
 const m=dn.match(/^MJ-(\d{2})(\d)(\d{2})/);if(!m)return null;
 if(cp&&/formal arraignment|common pleas|pre-?trial|call of the list|^trial/i.test(t))return P(cp);
 let code=m[1]+'-'+m[2]+'-'+m[3];const jl=lastNm(e&&e.judge).toLowerCase();
 if(jl.length>2){const hit=Object.keys(LL_MDJ).find(k=>k.slice(0,2)===m[1]&&lastNm(LL_MDJ[k][0]).toLowerCase()===jl);if(hit)code=hit}
 const r=LL_MDJ[code]||['','','',''];return {name:'District Court '+code,street:r[1],city:r[2]?r[2]+', PA '+r[3]:(c.county?c.county+' County':''),code:code}}
function addrHtml(p){if(!p)return '';const q=[p.code?'Magisterial District Court '+p.code:p.name,p.street,p.city].filter(Boolean).join(', ')+(p.street||/PA/.test(p.city)?'':', PA');
 return '<details class="ad"><summary>&#128205; Address &#9662;</summary><a href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q)+'" target="_blank" rel="noopener">'+esc(p.name)+(p.street?'<br>'+esc(p.street):'')+(p.city?'<br>'+esc(p.city):'')+'<span class="go">Open in Maps &#8250;</span></a></details>'}
function render(){const back=document.getElementById('back'),title=document.getElementById('title'),main=document.getElementById('main');
 main.classList.toggle('srch',S.view==='search');if(S.view==='search'){back.textContent='';title.textContent='Latoison Law';main.innerHTML=searchHtml()}
 else if(S.view==='results'){back.textContent='‹ Search';title.textContent=S.busy?'Searching…':(S.results?S.results.count+' docket'+(S.results.count===1?'':'s'):'');main.innerHTML=resultsHtml()}
 else{back.textContent='‹ Results';title.textContent=S.cardFor?S.cardFor.dn:'';main.innerHTML=cardHtml()}
 document.querySelector('.nav').classList.toggle('long',S.view==='card');document.querySelector('.nav').style.display=S.view==='search'?'none':'';
 wire()}
function opt(v,t,sel){return '<option value="'+esc(v)+'"'+(v===sel?' selected':'')+'>'+esc(t)+'</option>'}
function searchHtml(){const f=S.form;return ''+
 '<form id="sf" autocomplete="off"><div class="row"><div><label for="last">Last name</label><input id="last" name="last" value="'+esc(f.last)+'" autocapitalize="words"></div>'+
 '<div><label for="first">First name</label><input id="first" name="first" value="'+esc(f.first)+'" autocapitalize="words"></div></div>'+
 '<label for="dob">Date of birth</label><input id="dob" name="dob" value="'+esc(f.dob)+'" inputmode="numeric" placeholder="MM/DD/YYYY (optional)">'+
 '<div class="row"><div><label for="county">County</label><select id="county" name="county">'+opt('','Any',f.county)+LL.counties.map(c=>opt(c,c,f.county)).join('')+'</select></div>'+
 '<div><label for="status">Status</label><select id="status" name="status">'+opt('','Any',f.status)+['Active','Inactive','Closed','Adjudicated'].map(c=>opt(c,c,f.status)).join('')+'</select></div></div>'+
 '<label for="type">Case type</label><select id="type" name="type">'+opt('','Choose a case type',f.type)+[['criminal','Criminal (all courts)'],['non-traffic','Non-Traffic (summary)'],['traffic','Traffic'],['summary-appeal','Summary Appeal'],['all','All case types']].map(x=>opt(x[0],x[1],f.type)).join('')+'</select>'+
 '<button class="btn" type="submit"'+(S.busy?' disabled':'')+'>SEARCH</button>'+
 '<button class="clr" type="button" id="clearBtn">CLEAR</button>'+
 (S.error?'<div class="err">'+esc(S.error)+'</div>':'')+
 '<div class="hint">At least 3 letters of the last name and 2 of the first.</div></form>'+
 '<div class="note">Public court records from the Pennsylvania Unified Judicial System. Records can be late or incomplete — always check the full docket.</div>'+
 '<div class="shwrap"><button class="share" type="button" id="shareBtn">SHARE THIS APP</button>'+(S.shareOpen?shareHtml():'')+'</div>'}
function resultsHtml(){if(S.busy)return '<div class="wait"><div class="spin"></div>Searching the court records…<br><span style="font-weight:600">This can take 10–30 seconds.</span></div>';
 if(S.error)return '<div class="err">'+esc(S.error)+'</div>';const r=S.results;if(!r)return '';
 if(!r.count)return '<div class="err">No dockets found for '+esc(r.searched.first+' '+r.searched.last)+'. Check the spelling, or try fewer letters, a different case type, or Any county.</div>';
 let h='';if(r.more_pages)h+='<div class="err">The court site has more results than it shows'+(r.with_dob?'':' — add the date of birth')+' or pick a county to narrow it.</div>';
 r.people.forEach((p,pi)=>{h+='<div class="who">'+esc(p.name)+(p.dob?' — '+esc(p.dob):'')+(p.match?'<span class="m">DOB MATCH</span>':'')+'</div>';
  p.dockets.forEach((d,di)=>{const c=stCls(d.status);h+='<button class="res '+c+'" type="button" data-open="'+pi+':'+di+'"><div class="rt"><span class="dn">'+esc(d.dn)+'</span><span class="st '+c+'">'+esc(d.status||'—')+'</span></div>'+
   '<div class="rs"><span class="ct">'+esc(d.court)+'</span> '+esc(d.county)+(d.filed?' · filed '+esc(d.filed):'')+(d.next?' · <span class="nx">Next '+esc((String(d.next).match(/\d{1,2}\/\d{1,2}\/\d{4}/)||[d.next])[0])+'</span>':'')+(d.moved_to?'<br>Moved up to '+esc(d.moved_to):'')+'</div></button>'})});
 return h}
function cardHtml(){const d=S.cardFor;if(S.busy)return '<div class="wait"><div class="spin"></div>Opening '+esc(d&&d.dn)+'…<br><span style="font-weight:600">Reading the docket sheet, about 10 seconds.</span></div>';
 if(S.error)return '<div class="err">'+esc(S.error)+'</div>'+(d&&d.url?'<a class="pdf" href="'+esc(d.url)+'" target="_blank" rel="noopener">OPEN THE FULL DOCKET (PDF)</a>':'');
 const c=S.card;if(!c)return '';const n=c.next,cust=c.custody;
 let h='<div class="card"><div class="nm">'+esc(c.name||d.name)+'</div><div class="dob">'+(c.dob?'DOB '+esc(c.dob):'')+'</div>';
 h+=n?'<div class="next">NEXT: '+esc(n.type)+'<br>'+esc(day(n.date))+' '+esc(n.date)+' · '+esc(n.time)+(n.judge?' · Judge '+esc(lastNm(n.judge)):'')+addrHtml(llPlace(c,n))+'</div>':'<div class="nonext">No court date scheduled</div>';
 if(cust&&cust.in)h+='<div class="cust">IN CUSTODY'+(cust.location?' — '+esc(cust.location):'')+(cust.since?' (since '+esc(cust.since)+')':'')+'</div>';
 const kv=[];kv.push('<b>'+esc(c.court)+'</b> · '+esc(c.county)+' · <b>'+esc((c.status||'').toUpperCase())+'</b>');
 if(c.judge)kv.push('<b>Judge:</b> '+esc(c.judge));
 if(c.orig)kv.push('<b>Origination:</b> '+(c.orig.authority?'Judge '+esc(c.orig.authority):'')+(c.orig.docket?'<br>'+esc(c.orig.docket):''));
 if(d&&d.moved_to)kv.push('<b>Moved up to:</b> '+esc(d.moved_to));
 if(c.agency)kv.push('<b>Arresting agency:</b> '+esc(c.agency));
 if(c.processing)kv.push('<b>Stage:</b> '+esc(c.processing));
 if(c.bail_now)kv.push('<b>Bail:</b> '+esc(c.bail_now));
 if(!(cust&&cust.in))kv.push('<b>Custody:</b> Not in custody'+(cust&&cust.released?' (released '+esc(cust.released)+')':cust?'':' (no confinement listed)'));
 h+='<div class="kv">'+kv.join('<br>')+'</div></div>';
 h+='<div class="sec open">Charges ('+c.charges.length+')</div><div class="secb">'+chargesHtml(c)+'</div>';
 h+=sec('ev','Court dates ('+c.events.length+')',eventsHtml(c));
 if(c.bail.length)h+=sec('bl','Bail history ('+c.bail.length+')',c.bail.map(b=>'<div class="ev"><span class="w">'+esc(b.date)+'</span><span><b>'+esc(b.action)+'</b> '+esc([b.type,b.pct,b.amount].filter(Boolean).join(' · '))+'</span></div>').join(''));
 h+=sec('pt','Participants',peopleHtml(c));
 h+='<a class="pdf" href="'+esc(c.url)+'" target="_blank" rel="noopener">OPEN THE FULL DOCKET (PDF)</a>';
 if(!c.read_ok)h+='<div class="err">Part of this docket could not be read. Open the full docket for the details.</div>';
 return h}
function shareText(){const u=LL.appUrl||location.href;return 'Latoison Law — free Pennsylvania court docket search on your phone.\nOpen it: '+u+'\n\nTo put it on your home screen:\n• Android users: open the link in Chrome, tap ⋮ (top right), then tap "Install app".\n• iPhone users: open the link in Safari, tap the Share button (square with an arrow), then tap "Add to Home Screen".'}
function shareHtml(){const t=shareText(),e=encodeURIComponent(t);return '<div class="shbox"><a href="sms:?&body='+e+'" target="_top">TEXT IT</a><a class="em" href="mailto:?subject='+encodeURIComponent('Latoison Law docket app')+'&body='+e+'" target="_top">EMAIL IT</a><div class="t">Or copy this message:</div><textarea readonly id="shareTxt">'+esc(t)+'</textarea></div>'}
function sec(k,t,body){const o=!!S.open[k];return '<button class="sec'+(o?' open':'')+'" type="button" data-sec="'+k+'">'+t+' <span>'+(o?'▾':'▸')+'</span></button>'+(o?'<div class="secb">'+body+'</div>':'')}
function chargesHtml(c){if(!c.charges.length)return '<div class="ch">No current charges listed.</div>';const all=!!S.open.chAll,list=all?c.charges:c.charges.slice(0,4);
 let h=list.map(x=>'<div class="ch"><span class="gr">'+esc(x.grade||'—')+'</span><span class="s">'+esc(x.desc)+'</span><div class="d">Seq '+esc(x.seq)+(x.orig?' (orig '+esc(x.orig)+')':'')+' · '+esc(x.statute)+' · '+esc(x.date)+'</div>'+(x.disp?'<div class="dp">'+esc(x.disp)+(x.disp_date?' · '+esc(x.disp_date):'')+'</div>':'')+(x.sentence?'<div class="sn">Sentenced '+esc(x.sent_date||'')+(x.sent_judge?' (Judge '+esc(x.sent_judge)+')':'')+': '+esc(x.sentence)+'</div>':'')+(x.conditions?'<div class="cn">Conditions: '+esc(x.conditions)+'</div>':'')+'</div>').join('');
 if(c.charges.length>4)h+='<button class="more" type="button" data-sec="chAll">'+(all?'Show fewer ▴':'Show all '+c.charges.length+' ▾')+'</button>';
 if(c.dropped)h+='<div class="ch d" style="color:#555">'+c.dropped+' replaced / withdrawn / dismissed charge'+(c.dropped===1?'':'s')+' not shown.</div>';return h}
function eventsHtml(c){if(!c.events.length)return '<div class="ch">No court dates listed.</div>';const nx=c.next;
 return c.events.slice().reverse().map(e=>{const isNx=nx&&e.date===nx.date&&e.type===nx.type,past=!isNx&&e.iso<(nx?nx.iso:'9');return '<div class="ev'+(isNx?' nx':past?' past':'')+'"><span class="w">'+esc(e.date)+'<br><span class="es">'+esc(e.time)+'</span></span><span>'+esc(e.type)+(e.judge?' · '+esc(e.judge):'')+'<br><span class="es">'+esc(e.status)+'</span>'+addrHtml(llPlace(c,e))+'</span></div>'}).join('')}
function peopleHtml(c){let h='<div class="pt"><div class="r">Defense attorney</div>'+(c.defense.length?c.defense.map(a=>esc(a.name)+(a.kind?' ('+esc(a.kind.toLowerCase())+')':'')+(a.phone?'<br><a href="tel:'+esc(a.phone.replace(/\D/g,''))+'">'+esc(a.phone)+'</a>':'')).join('<br>'):'None listed')+'</div>';
 h+='<div class="pt"><div class="r">Commonwealth</div>'+(c.commonwealth.length?c.commonwealth.map(n=>'ADA '+esc(n)).join(' · '):'None listed')+'</div>';
 h+='<div class="pt"><div class="r">Arresting officer</div>'+(c.officer?esc(c.officer):'None listed')+(c.agency?' — '+esc(c.agency):'')+'</div>';return h}

function wire(){const f=document.getElementById('sf');
 if(f)f.onsubmit=e=>{e.preventDefault();const F=S.form;['last','first','dob','county','status','type'].forEach(k=>F[k]=document.getElementById(k).value.trim());
  if(F.last.replace(/[^A-Za-z]/g,'').length<3||F.first.replace(/[^A-Za-z]/g,'').length<2){S.error='Type at least 3 letters of the last name and 2 of the first name.';render();return}
  if(!F.type){S.error='Choose a case type.';render();return}
  if(F.dob&&!/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(F.dob)){S.error='Type the birth date as MM/DD/YYYY, or leave it blank.';render();return}
  S.busy=true;S.results=null;go('results');call('llSearch',Object.assign({dev:dev()},F)).then(r=>{S.busy=false;if(r&&r.error){S.error=r.error}else S.results=r;render()},e=>{S.busy=false;S.error=msg(e);render()})};
 document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{const [pi,di]=b.getAttribute('data-open').split(':').map(Number),d=S.results.people[pi].dockets[di];
  S.cardFor=d;S.card=null;S.open={};S.busy=true;go('card');
  call('llCard',{dev:dev(),dn:d.dn,url:d.url,county:d.county,status:d.status,name:d.name,dob:d.dob,filed:d.filed}).then(r=>{if(S.cardFor!==d)return;S.busy=false;if(r&&r.error)S.error=r.error;else S.card=r.card;render()},e=>{S.busy=false;S.error=msg(e);render()})});
 const cb=document.getElementById('clearBtn');if(cb)cb.onclick=()=>{S.form={last:'',first:'',dob:'',county:'',status:'Active',type:''};S.results=null;S.card=null;S.cardFor=null;S.error='';S.shareOpen=false;render();const l=document.getElementById('last');if(l)l.focus()};
 const sb=document.getElementById('shareBtn');if(sb)sb.onclick=()=>{const t=shareText();if(navigator.share){navigator.share({title:'Latoison Law',text:t}).catch(()=>{S.shareOpen=true;render()});return}S.shareOpen=!S.shareOpen;render()};
 document.querySelectorAll('[data-sec]').forEach(b=>b.onclick=()=>{const k=b.getAttribute('data-sec');S.open[k]=!S.open[k];render()});
 const dob=document.getElementById('dob');if(dob)dob.oninput=()=>{let v=dob.value.replace(/[^\d]/g,'').slice(0,8);if(v.length>4)v=v.slice(0,2)+'/'+v.slice(2,4)+'/'+v.slice(4);else if(v.length>2)v=v.slice(0,2)+'/'+v.slice(2);dob.value=v}}
function msg(e){return String(e&&e.message||e||'Something went wrong. Please try again.').replace(/^Exception:\s*/,'')}
document.getElementById('back').onclick=()=>{if(S.view==='search')return;if(S.depth>0){try{history.back();return}catch(e){}}go(S.view==='card'?'results':'search',false)};
try{history.replaceState({v:'search'},'')}catch(e){}
render();
</script>
</body></html>
